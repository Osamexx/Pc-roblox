name: Windows RDP (Simples)

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Senha do Windows (mínimo 8 caracteres)'
        required: true
        default: 'SenhaForte123'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Habilitar RDP e definir senha
        env:
          RDP_PASSWORD: ${{ github.event.inputs.rdp_password }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: Instalar Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /quiet" -Wait

      - name: Conectar Tailscale
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TS_AUTHKEY }} --hostname=windows-rdp --accept-dns=false
          Start-Sleep -Seconds 10
          & "C:\Program Files\Tailscale\tailscale.exe" status

      - name: Mostrar informações de conexão
        run: |
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "=============================================="
          Write-Host "Windows pronto!"
          Write-Host "IP Tailscale:" $ip
          Write-Host "Porta: 3389"
          Write-Host "Usuario: runneradmin"
          Write-Host "Senha: a que voce digitou"
          Write-Host "=============================================="
          Write-Host "Conecte com Microsoft Remote Desktop usando:" $ip":3389"

      - name: Manter a máquina ligada
        run: |
          while ($true) {
            Write-Host "Maquina ativa - $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 300
          }
